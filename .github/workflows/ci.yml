name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install python-docx pybtex latex2mathml lxml pyyaml
      - name: Verify imports
        run: |
          cd engine
          python -c "from docx_engine import DocxBuilder; print('DocxBuilder OK')"
          python -c "from qmd_parser import parse_qmd; print('qmd_parser OK')"
          python -c "from bib_formatter import BibFormatter; print('BibFormatter OK')"
